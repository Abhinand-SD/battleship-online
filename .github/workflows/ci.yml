name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: battleship
          POSTGRES_PASSWORD: battleship
          POSTGRES_DB: battleship_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U battleship"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://battleship:battleship@localhost:5432/battleship_test
      DATABASE_URL: postgresql://battleship:battleship@localhost:5432/battleship_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/client
      - name: End-to-end tests
        run: npx playwright test
        working-directory: packages/client
        env:
          PW_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/client/playwright-report
